name: Build Packing POS APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag rilis (kosong = packing-pos-<run number>)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Generate Android platform files when absent
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.packingpos --project-name packing_pos
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_RELEASE_TAG}" ]; then
            TAG="${INPUT_RELEASE_TAG}"
          else
            TAG="packing-pos-${GITHUB_RUN_NUMBER}"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --target "${GITHUB_SHA}" \
            --title "Packing POS $TAG" \
            --notes "Build otomatis Packing POS. APK terlampir."
          gh release upload "$TAG" build/app/outputs/flutter-apk/app-release.apk \
            --clobber
